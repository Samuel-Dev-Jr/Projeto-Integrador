        <path class="letra l2" d="M 325 90.7 C 321.9 91.1, 318.5 92.4, 315.9 94.2 C 313.3 96, 313.1 96, 313.2 93.5 C 313.3 91.5, 313.1 91.3, 309.8 91.1 C 307.9 90.9, 304.9 91, 303.1 91.3 L 299.8 91.8 299.8 123.6 L 299.8 155.3 306.7 155.3 L 313.7 155.3 313.7 144.8 L 313.7 134.2 315.9 135.6 C 320.9 138.9, 322.7 139.4, 328.9 139.4 C 339.2 139.4, 346.3 134.9, 350.5 125.9 C 353.1 120.3, 352.9 109, 350 103.6 C 345.1 94.3, 335.3 89.2, 325 90.7 M 323 102.5 C 317.2 104.3, 314.5 108.4, 314.5 115.2 C 314.5 122.7, 319.7 128.2, 327 128.2 C 335.4 128.2, 340.8 117.3, 336.6 108.6 C 334.4 103.9, 327.8 101, 323 102.5" /> <!-- p -->
        <path class="letra l3" d="M 354.1 91.3 C 354.1 91.5, 358.1 101, 363.1 112.4 C 375 139.9, 374.8 139.2, 373.6 141.7 C 372.1 145.1, 368.2 146.4, 363.6 145.1 L 359.7 143.9 357.5 148.5 C 355.3 153.1, 355.3 153.2, 356.8 154.3 C 361 157.4, 371.4 157.6, 377 154.7 C 383.1 151.6, 384.7 149.1, 392.8 130 C 396.2 122, 401.1 110.6, 403.6 104.8 C 410.3 89.4, 410.4 90.9, 402.7 90.9 C 398.4 90.9, 395.9 91.3, 395.4 91.9 C 394.7 92.8, 387.3 110.1, 383.7 119.3 L 382.1 123.1 380.8 120 C 380.1 118.3, 377.1 111.2, 374.2 104.1 L 369 91.3 361.5 91.1 C 357.4 91, 354.1 91, 354.1 91.3" /> <!-- y -->
