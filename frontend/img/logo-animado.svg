<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 232" role="img" aria-label="SpyCode">

    <style>
        /* ==========================================================
           LOGO ANIMADO DO SPYCODE
           Tudo é CSS dentro do próprio SVG, sem JavaScript.
           O NOME anima uma vez só, quando a página abre.
           O ESPIÃO repete para sempre um ciclo de 9 segundos:
           olha para um lado, olha para o outro, levanta a lupa,
           confere, guarda a lupa e descansa.
           ========================================================== */


        /* ---------- 1. ENTRADA: toca uma vez ---------- */

        /* o espião surge crescendo */
        .espiao {
            transform-box: fill-box;
            transform-origin: center;
            animation: surge 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) both;
        }

        /* cada letra do nome sobe e aparece, uma depois da outra */
        .letra {
            animation: letra 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }

        .letra.l1 { animation-delay: 0.25s; }
        .letra.l2 { animation-delay: 0.32s; }
        .letra.l3 { animation-delay: 0.39s; }
        .letra.l4 { animation-delay: 0.46s; }
        .letra.l5 { animation-delay: 0.53s; }
        .letra.l6 { animation-delay: 0.6s; }
        .letra.l7 { animation-delay: 0.67s; }

        @keyframes surge {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes letra {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* ---------- 2. CICLO DO ESPIÃO: 9 segundos, repete para sempre ----------
           Todas as regras abaixo têm a mesma duração e o mesmo atraso,
           por isso as porcentagens dos @keyframes ficam sincronizadas.
           1% do ciclo = 0,09 segundo. */

        .cabeca,
        .rosto,
        .chapeu,
        .gola,
        .lupa,
        .aro,
        .reflexo,
        .selo {
            animation-duration: 9s;
            animation-delay: 1.3s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.45, 0, 0.3, 1);
        }

        /* a cabeça inteira vira para os lados, girando em torno do pescoço */
        .cabeca {
            transform-origin: 104px 158px;
            animation-name: olha;
        }

        /* o rosto anda mais que o chapéu e a gola quase não sai do lugar:
           essa diferença é o que dá a impressão de a cabeça estar virando */
        .rosto { animation-name: olha_rosto; }
        .gola { animation-name: olha_gola; }

        /* o chapéu acompanha o olhar e, perto do fim do ciclo, faz um cumprimento */
        .chapeu {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation-name: olha_chapeu;
        }

        /* a lupa fica guardada (invisível, caída para baixo) e sobe na hora de conferir.
           O ponto de giro é a ponta do cabo, como se uma mão a segurasse. */
        .lupa {
            opacity: 0;
            transform: translate(0, 110px) rotate(-18deg);
            transform-origin: 222px 222px;
            animation-name: levanta;
        }

        /* o aro fica verde na hora em que a conferência dá certo */
        .aro { animation-name: confere; }

        /* um reflexo de luz atravessa o vidro */
        .reflexo {
            transform: translateX(-150px);
            animation-name: reflexo;
        }

        /* o selo de "conferido" pula no canto da lupa */
        .selo {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation-name: selo;
        }

        @keyframes olha {
            0%, 8% { transform: translate(0, 0) rotate(0deg); }
            13%, 19% { transform: translate(-6px, 0) rotate(-7deg); }
            26%, 32% { transform: translate(6px, 0) rotate(7deg); }
            37%, 44% { transform: translate(0, 0) rotate(0deg); }
            49% { transform: translate(-2px, 0) rotate(-3deg); }
            54% { transform: translate(2px, 0) rotate(3deg); }
            58%, 100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes olha_rosto {
            0%, 8% { transform: translateX(0); }
            13%, 19% { transform: translateX(-5px); }
            26%, 32% { transform: translateX(5px); }
            37%, 100% { transform: translateX(0); }
        }

        @keyframes olha_gola {
            0%, 8% { transform: translateX(0); }
            13%, 19% { transform: translateX(2px); }
            26%, 32% { transform: translateX(-2px); }
            37%, 100% { transform: translateX(0); }
        }

        @keyframes olha_chapeu {
            0%, 8% { transform: translate(0, 0) rotate(0deg); }
            13%, 19% { transform: translate(-2px, 0) rotate(0deg); }
            26%, 32% { transform: translate(2px, 0) rotate(0deg); }
            37%, 80% { transform: translate(0, 0) rotate(0deg); }
            84% { transform: translate(0, -7px) rotate(-6deg); }
            89%, 100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes levanta {
            0%, 36% { opacity: 0; transform: translate(0, 110px) rotate(-18deg); }
            39% { opacity: 1; }
            43% { opacity: 1; transform: translate(0, -5px) rotate(3deg); }
            46% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5px, 1px) rotate(-2deg); }
            54% { transform: translate(4px, 0) rotate(1.5deg); }
            58%, 64% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
            71%, 100% { opacity: 0; transform: translate(0, 110px) rotate(-18deg); }
        }

        @keyframes confere {
            0%, 55% { fill: #FFFFFF; }
            58%, 62% { fill: #2BD96B; }
            66%, 100% { fill: #FFFFFF; }
        }

        @keyframes reflexo {
            0%, 45% { transform: translateX(-150px); }
            54%, 100% { transform: translateX(150px); }
        }

        @keyframes selo {
            0%, 55% { opacity: 0; transform: scale(0); }
            58% { opacity: 1; transform: scale(1.25); }
            60%, 63% { opacity: 1; transform: scale(1); }
            67%, 100% { opacity: 0; transform: scale(0); }
        }


        /* ---------- 3. ACESSIBILIDADE ----------
           Quem pediu "menos movimento" no sistema vê o logo parado, com a lupa levantada. */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }

            .lupa {
                opacity: 1;
                transform: none;
            }
        }
    </style>


    <defs>
        <!-- recorte redondo do tamanho do vidro, para o reflexo não passar do aro -->
        <clipPath id="vidro">
            <circle cx="104" cy="104" r="78" />
        </clipPath>
    </defs>


    <!-- 1. ESPIÃO: gola, rosto e chapéu, cada parte no seu grupo para poder mexer separado -->
