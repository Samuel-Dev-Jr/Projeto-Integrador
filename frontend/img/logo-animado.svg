        <g class="selo">
            <circle cx="176" cy="36" r="24" fill="#2BD96B" stroke="#03110B" stroke-width="5" />
            <polyline points="165,37 173,45 188,28" fill="none" stroke="#02140C" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" />
        </g>

    </g>


